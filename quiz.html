<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>Tes Bunpou N5 — Latihan Interaktif</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2256%22%20height%3D%2256%22%20rx%3D%2210%22%20fill%3D%22%23b7412f%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fdf9f0%22%20stroke-width%3D%225.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M32%2015.5%20L32%2019.5M17%2025.5%20L47%2025.5M40%2028.5%20C35%2039%2026%2046.5%2016%2052.5M24%2028.5%20C29%2039%2038%2046.5%2048%2052.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">

<script>
  (function(){
    var s = localStorage.getItem('bunpou-theme');
    if(!s) s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = s;
  })();
</script>
<style>
  :root{
    --bg:#efe9db; --bg2:#e6dfcd; --card:#fdfbf4; --fg:#241f18; --muted:#8a7c62;
    --accent:#8a5a2b; --accent2:#6b4420; --ok:#2f7d4f; --bad:#a83a32; --warn:#9a6b1f;
    --line:#d9d0ba; --line2:#c8bda3; --radius:8px;
    --sh:0 1px 2px rgba(60,45,20,.06), 0 6px 18px rgba(60,45,20,.06);
    --onaccent:#fdf9f0;
    --okbg:#eef7f1; --badbg:#f9ecea; --optbg:#fffdf8; --opthov:#fffaf0;
    --grain:.05; --glow:rgba(138,90,43,0);
    --hd-bg:linear-gradient(180deg, rgba(243,238,227,.97), rgba(243,238,227,.92));
    --inset-hi:rgba(255,255,255,.6);
    --drop:rgba(70,55,25,.10);
    --sheen:rgba(255,255,255,.55);
    --blend:multiply;
    --aurora-c:rgba(138,90,43,.16);
    --dur:.22s; --ease:cubic-bezier(.22,.68,.32,1);
  }
  [data-theme="dark"]{
    --bg:#16151a; --bg2:#201e26; --card:#1e1d24; --fg:#e8e2d6; --muted:#93897a;
    --accent:#d09a5c; --accent2:#e6b47c; --ok:#5cb87f; --bad:#e0705f; --warn:#d6a24a;
    --line:#302e39; --line2:#3b3945; --radius:8px;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.34);
    --onaccent:#191820;
    --okbg:#16301f; --badbg:#33191a; --optbg:#232229; --opthov:#2a2831;
    --grain:.09; --glow:rgba(208,154,92,.10);
    --hd-bg:linear-gradient(180deg, rgba(26,25,31,.95), rgba(20,19,24,.90));
    --inset-hi:rgba(255,255,255,.05);
    --drop:rgba(0,0,0,.42);
    --sheen:rgba(255,255,255,.10);
    --blend:screen;
    --aurora-c:rgba(196,132,64,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @keyframes grain-shift{
    0%{background-position:0 0, 0 0}
    50%{background-position:0 0, 37px 23px}
    100%{background-position:0 0, 0 0}
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px)}
    to{opacity:1; transform:none}
  }
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  @keyframes pop{
    0%{transform:scale(1)}
    42%{transform:scale(1.035)}
    100%{transform:scale(1)}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    22%{transform:translateX(-4px)}
    55%{transform:translateX(3px)}
    80%{transform:translateX(-1.5px)}
  }
  @keyframes mark-in{
    0%{opacity:0; transform:scale(.4) rotate(-25deg)}
    60%{opacity:1; transform:scale(1.25) rotate(6deg)}
    100%{opacity:1; transform:scale(1) rotate(0)}
  }
  @keyframes sheen{
    0%{transform:translateX(-120%)}
    100%{transform:translateX(320%)}
  }
  @keyframes glowpulse{
    0%,100%{box-shadow:0 0 0 0 var(--glow)}
    50%{box-shadow:0 0 0 5px var(--glow)}
  }
  body{
    margin:0; color:var(--fg); line-height:1.62;
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--card) 0%, transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.05'/></svg>");
    background-attachment:fixed, fixed;
    animation:grainshift 22s steps(1) infinite;
    transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  /* ---------- header ---------- */
  /* ============ header ============ */
  .hd{
    position:sticky; top:0; z-index:20;
    background:var(--hd-bg);
    backdrop-filter:blur(10px) saturate(1.2);
    border-bottom:1px solid var(--line2);
    box-shadow:0 1px 0 var(--inset-hi) inset, 0 6px 22px var(--drop);
    transition:box-shadow .3s var(--ease), background-color var(--dur) var(--ease);
  }
  .hd.shrink{box-shadow:0 1px 0 var(--inset-hi) inset, 0 10px 30px var(--drop)}
  .hd-in{max-width:940px;margin:0 auto;padding:14px 20px 12px}
  .hd h1{
    margin:0;font-size:23px;font-weight:700;letter-spacing:.2px;
    color:var(--accent2); position:relative; display:inline-block;
  }
  .hd h1 small{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:1.4px;
    text-transform:uppercase;display:block;margin-top:3px}
  /* WordReveal (React Bits) */
  .wr{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(6px);
      animation:wr .62s var(--ease) forwards}
  @keyframes wr{to{opacity:1;transform:none;filter:blur(0)}}
  /* ShimmerText (React Bits) */
  .shim{
    background:linear-gradient(100deg,var(--accent2) 0%,var(--fg) 42%,var(--accent) 50%,var(--fg) 58%,var(--accent2) 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shim 7s linear infinite;
  }
  @keyframes shim{to{background-position:250% 0}}
  .hd-rule{height:1px;background:repeating-linear-gradient(90deg,var(--line2) 0 6px,transparent 6px 12px);margin:9px 0 10px}
  /* ============ stats + CountUp (React Bits) ============ */
  .stats{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;line-height:1.25;position:relative;padding-left:9px}
  .stat::before{
    content:"";position:absolute;left:0;top:4px;bottom:6px;width:2px;border-radius:99px;
    background:var(--sc,var(--line2));transform:scaleY(0);transform-origin:bottom;
    animation:grow .5s var(--ease) .25s forwards;
  }
  .stat:nth-child(1){--sc:var(--ok)} .stat:nth-child(2){--sc:var(--accent)}
  .stat:nth-child(3){--sc:var(--bad)}
  @keyframes grow{to{transform:scaleY(1)}}
  .stat b{font-size:19px;color:var(--accent2);font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .pct{
    margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    text-transform:uppercase;letter-spacing:.8px;
  }
  .pct .cap{order:2}
  .pct b{font-size:20px;color:var(--accent2)}
  .pct.good b{color:var(--ok)} .pct.mid b{color:var(--warn)} .pct.low b{color:var(--bad)}
  .ring{
    width:46px;height:46px;flex:0 0 46px;position:relative;
  }
  .ring svg{transform:rotate(-90deg);display:block}
  .ring circle{fill:none;stroke-width:5;stroke-linecap:round}
  .ring .bg{stroke:var(--line2)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .5s var(--ease), stroke .3s}
  .ring .lbl{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:12px;font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums;
  }
  /* ============ progress ============ */
  .pbar{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:11px;
        border:1px solid var(--line2);position:relative}
  .pbar i{display:block;height:100%;width:0;border-radius:99px;position:relative;overflow:hidden;
         background:linear-gradient(90deg,var(--accent),var(--accent2));
         transition:width .5s var(--ease), background .3s}
  .pbar i::after{
    content:"";position:absolute;inset:0;width:40%;
    background:linear-gradient(90deg,transparent,var(--sheen),transparent);
    animation:sheen 2.4s var(--ease) infinite;
  }
  .pbar.ok i{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 62%,#fff))}
  /* ============ controls ============ */
  .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .btn{
    position:relative;overflow:hidden;
    font-family:inherit;font-size:13.5px;padding:7px 15px;cursor:pointer;
    border:1px solid var(--line2); background:var(--card); color:var(--accent2);
    border-radius:var(--radius);
    transition:transform .16s var(--ease),border-color .16s,color .16s,box-shadow .16s;
    box-shadow:0 1px 0 var(--inset-hi) inset;
  }
  .btn::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,var(--sheen) 50%,transparent 70%);
    transform:translateX(-130%);transition:transform .5s var(--ease);
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);
            box-shadow:0 4px 12px var(--drop)}
  .btn:hover::after{transform:translateX(130%)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent2)}
  .btn.pri:hover{background:var(--accent2);color:var(--onaccent)}
  .btn[aria-pressed="true"]{
    background:var(--accent2);color:var(--onaccent);border-color:var(--accent2);
  }
  .btn .ico{font-size:14px;line-height:1;margin-right:5px;display:inline-block;
            transition:transform .35s var(--ease)}
  .btn:hover .ico{transform:rotate(-18deg) scale(1.12)}
  .hint{font-size:12px;color:var(--muted);margin-left:auto}
  .hint b{color:var(--accent2);font-weight:700}
  /* ============ filter tabs ============ */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
        border-top:1px dashed var(--line2)}
  .tab{
    position:relative;overflow:hidden;
    font-family:inherit;font-size:12.5px;padding:5px 11px;cursor:pointer;
    border:1px solid var(--line2);background:transparent;color:var(--muted);
    border-radius:99px;transition:color .18s var(--ease),border-color .18s,transform .18s;
  }
  .tab:hover{color:var(--accent2);border-color:var(--accent);transform:translateY(-1px)}
  .tab.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent2);
          font-weight:700;box-shadow:0 3px 10px var(--glow)}
  .tab .mini{
    display:inline-block;margin-left:5px;padding:0 5px;border-radius:99px;
    font-size:10.5px;font-variant-numeric:tabular-nums;
    background:var(--bg2);color:var(--muted);
  }
  .tab.on .mini{background:color-mix(in srgb,var(--onaccent) 22%,transparent);color:var(--onaccent)}
  .tab.full .mini{background:var(--ok);color:#fff}
  .tab.half .mini{background:var(--warn);color:#fff}
  .tab.empty .mini{background:var(--bad);color:#fff}
  /* ============ main ============ */
  main{max-width:940px;margin:0 auto;padding:22px 20px 70px}
  .ph{
    margin:30px 0 12px;padding-bottom:7px;font-size:18px;color:var(--accent2);
    border-bottom:1px dashed var(--line2);display:flex;align-items:baseline;gap:9px;
    animation:fadein .45s var(--ease) both;
  }
  .ph:first-child{margin-top:6px}
  .ph .n{
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--onaccent);
    background:var(--accent);padding:2px 8px;border-radius:99px;font-weight:700;
  }
  .ph .meta{font-size:12px;color:var(--muted);margin-left:auto;font-weight:400}
  /* ============ card + Spotlight/GlowBorder/Tilt (React Bits) ============ */
  .card{
    background:var(--card);border:1px solid var(--line2);border-radius:10px;
    padding:17px 19px 13px;margin:12px 0;box-shadow:var(--sh);position:relative;
    animation:rise .5s var(--ease) both;
    transition:border-color .18s,box-shadow .28s var(--ease),transform .28s var(--ease);
    will-change:transform;
  }
  .card::before{
    content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;
    background:var(--line2);border-radius:99px;transition:background .25s,height .25s;
  }
  .card.ok::before{background:var(--ok);height:calc(100% - 24px)}
  .card.no::before{background:var(--bad);height:calc(100% - 24px)}
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    opacity:0;transition:opacity .3s var(--ease);
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),
               color-mix(in srgb,var(--accent) 13%,transparent), transparent 62%);
  }
  .card:hover{border-color:var(--line2);box-shadow:0 3px 6px var(--drop),0 14px 34px var(--drop)}
  .card:hover::after{opacity:1}
  .card.ok{border-color:color-mix(in srgb,var(--ok) 42%,var(--line2))}
  .card.no{border-color:color-mix(in srgb,var(--bad) 42%,var(--line2));animation:rise .5s var(--ease) both, shake .34s var(--ease)}
  .card.flash{animation:flash .6s var(--ease)}
  @keyframes flash{
    0%{box-shadow:var(--sh),0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}
    100%{box-shadow:var(--sh),0 0 0 14px transparent}
  }
  .qn{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;
      display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .qn .src{color:var(--muted);opacity:.72}
  .q{font-size:19px;line-height:1.5;margin-bottom:13px;white-space:pre-wrap;word-break:break-word}
  .q .blank{
    display:inline-block;min-width:5.5em;padding:0 .5em;margin:0 .12em;
    color:var(--accent);font-weight:700;text-align:center;letter-spacing:2px;
    border-bottom:2px dotted var(--accent);vertical-align:baseline;
  }
  /* ============ options ============ */
  .opt{
    position:relative;overflow:hidden;
    display:flex;width:100%;text-align:left;align-items:flex-start;gap:11px;
    margin:7px 0;padding:10px 13px;cursor:pointer;font-family:inherit;font-size:15.5px;
    border:1px solid var(--line);background:var(--optbg);color:var(--fg);
    border-radius:var(--radius);text-align:left;
    transition:transform .16s var(--ease),border-color .16s,background .16s,box-shadow .16s;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);background:var(--opthov);
    transform:translateX(4px);box-shadow:0 3px 10px var(--drop);
  }
  .opt:active:not(:disabled){transform:translateX(4px) scale(.99)}
  .opt:disabled{cursor:default}
  .opt .k{
    flex:0 0 22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;
    color:var(--muted);background:var(--bg2);border-radius:5px;margin-top:1px;
    transition:background .22s,color .22s,transform .22s var(--ease);
  }
  .opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop .34s var(--ease)}
  .opt.ok .k{background:var(--ok);color:#fff;transform:scale(1.1)}
  .opt.no{border-color:var(--bad);background:var(--badbg)}
  .opt.no .k{background:var(--bad);color:#fff}
  .opt .mk{margin-left:auto;font-weight:700;opacity:0;font-size:16px;line-height:1}
  .opt.ok .mk{color:var(--ok);opacity:1;animation:mark-in .42s var(--ease)}
  .opt.no .mk{color:var(--bad);opacity:1;animation:mark-in .42s var(--ease)}
  .fx{
    margin-top:9px;font-size:13.5px;color:var(--muted);display:none;
    padding-left:10px;border-left:2px solid currentColor;
    animation:fadein .35s var(--ease) both;
  }
  .card.ok .fx,.card.no .fx{display:block}
  .card.ok .fx{color:var(--ok)} .card.no .fx{color:var(--bad)}
  .empty{padding:46px 0;text-align:center;color:var(--muted);animation:fadein .4s var(--ease) both}
  /* ============ Aurora bg (React Bits) ============ */
  .aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.55}
  .aurora b{
    position:absolute;display:block;border-radius:50%;filter:blur(90px);
    background:var(--aurora-c);mix-blend-mode:var(--blend);
  }
  .aurora b:nth-child(1){width:40vw;height:40vw;left:-10vw;top:-14vw;
    animation:drift1 26s var(--ease) infinite alternate}
  .aurora b:nth-child(2){width:34vw;height:34vw;right:-12vw;top:24vh;
    animation:drift2 32s var(--ease) infinite alternate}
  .aurora b:nth-child(3){width:30vw;height:30vw;left:26vw;bottom:-16vw;
    animation:drift3 38s var(--ease) infinite alternate}
  [data-theme="dark"] .aurora{opacity:.34}
  @keyframes drift1{to{transform:translate(16vw,10vh) scale(1.25)}}
  @keyframes drift2{to{transform:translate(-14vw,16vh) scale(1.18)}}
  @keyframes drift3{to{transform:translate(10vw,-12vh) scale(1.3)}}
  /* ============ confetti ============ */
  .spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;
         z-index:60;animation:spark .95s var(--ease) forwards}
  @keyframes spark{
    0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.2)}
  }
  /* ============ toast ============ */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,150%);
    background:var(--card);border:1px solid var(--line2);color:var(--fg);
    padding:11px 20px;border-radius:99px;font-size:14px;box-shadow:0 10px 30px var(--drop);
    z-index:70;transition:transform .42s var(--ease);white-space:nowrap;
  }
  .toast.up{transform:translate(-50%,0)}
  .toast.ok{border-color:var(--ok);color:var(--ok)}
  .toast.no{border-color:var(--bad);color:var(--bad)}
  /* ============ Bouncing Dots (loading.dev) ============ */
  .bdots{display:flex;align-items:flex-end;gap:.34em;height:1em;color:var(--accent2)}
  .bdots i{
    display:block;width:.28em;height:.28em;border-radius:50%;
    background:currentColor;
    animation:bdot var(--bd,900ms) var(--ease) infinite;
  }
  .bdots i:nth-child(1){animation-delay:0ms}
  .bdots i:nth-child(2){animation-delay:calc(var(--bd,900ms) * .16)}
  .bdots i:nth-child(3){animation-delay:calc(var(--bd,900ms) * .32)}
  @keyframes bdot{
    0%,70%,100%{transform:translateY(0);opacity:.45}
    35%{transform:translateY(-.72em);opacity:1}
  }
  @media (prefers-reduced-motion:reduce){
    .bdots i{animation:none;opacity:.8;transform:translateY(-.3em)}
  }
  /* ============ boot overlay ============ */
  .boot{
    position:fixed;inset:0;z-index:200;display:grid;place-items:center;
    background:var(--bg);color:var(--accent2);
    transition:opacity .5s var(--ease),visibility .5s;
  }
  .boot.gone{opacity:0;visibility:hidden}
  .boot-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  .boot-in .bt{font-size:19px;font-weight:700;letter-spacing:.3px}
  .boot-in .bs{font-size:12px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
  .boot-bar{width:180px;height:3px;background:var(--bg2);border-radius:99px;overflow:hidden}
  .boot-bar i{display:block;height:100%;width:35%;border-radius:99px;
             background:linear-gradient(90deg,transparent,var(--accent),transparent);
             animation:bslide 1.05s var(--ease) infinite}
  @keyframes bslide{from{transform:translateX(-100%)}to{transform:translateX(380%)}}
  /* ============ per-part loading ============ */
  .partload{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);

ruby{ruby-position:over}

.extras{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:9px 0 2px}
.ro{font-size:12.5px;line-height:1.5;color:var(--muted);font-style:italic;

  word-break:break-word;flex:1 1 200px;min-width:0}
.tts{border:1px solid var(--line);background:var(--chip);color:var(--muted);

  font-family:inherit;white-space:nowrap;transition:.18s;flex:0 0 auto}
.tts:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.tts:active{transform:translateY(0)}
.srcf{margin-left:8px;color:var(--accent);text-decoration:none;font-size:10.5px;
  font-weight:600;opacity:.75}
.srcf:hover{opacity:1;text-decoration:underline}
.why{display:none;margin-top:11px;padding:11px 13px;border-radius:12px;
  border:1px solid var(--line);border-left:3px solid var(--accent);
  background:var(--chip);font-size:12.5px;line-height:1.65;color:var(--muted)}
.card.ans .why{display:block;animation:whyIn .34s ease both}
@keyframes whyIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.why b{color:var(--ink);font-weight:650;margin-right:5px}
.why b+b{display:block;margin-top:5px;color:var(--ok);font-size:12px}
.why i{display:block;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);

.card.ok .why{border-left-color:var(--ok)}
.card.no .why{border-left-color:var(--bad)}

<script>
const Q = [{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":1,"q":"きのうは　とても　　　　　　　。","html":"きのうは　とても<span class=\"blank\">____</span>。","ro":"kinouha totemo ... 。","speak":"きのうは とても えす 。","opts":["さむいです","さむいだったです","さむかったです","さむかったでした"],"ans":2,"k":"kihon","why":"setelah も di Bentuk kamus (asli). Setelah を, kata kerja tidak boleh diubah ke te-form maupun lampau.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":2,"q":"この　おかしは　　　　　　　。","html":"この　おかしは<span class=\"blank\">____</span>。","ro":"kono okasiha ... 。","speak":"この おかしは えす 。","opts":["おいしくなくです","おいしいないです","おいしくないです","おいしいなくです"],"ans":2,"k":"kunaidesu","why":"setelah は di Bentuk negatif kata sifat yang sopan: stem + くないdesu.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":3,"q":"やまかわさんの　かばんは　とても　　　　　　　。","html":"やまかわさんの　かばんは　とても<span class=\"blank\">____</span>。","ro":"yamakawasanno kabanha totemo ... 。","speak":"やまかわさんの かばんは とても えす 。","opts":["おもいでした","おもかったです","おもいかったです","おもかったでした"],"ans":1,"k":"kihon","why":"setelah も di Bentuk kamus (asli). Setelah を, kata kerja tidak boleh diubah ke te-form maupun lampau.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":4,"q":"かんじの　テストは　　　　　　　なかったです。","html":"かんじの　テストは<span class=\"blank\">____</span>なかったです。","ro":"kanzino tesutoha ... naka'tutadesu。","speak":"かんじの テストは えす なかったです。","opts":["むずかし","むずかしい","むずかしく","むずかしくて"],"ans":2,"k":"ku","why":"setelah は di Stem kata sifat (i-adjective): bentuknya tanpa くない. Bentuk sah: くnai, くkute, くku.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":5,"q":"あの人は　ゆうめい　　　　　　　。","html":"あの<ruby>人<rt>jin/nin</rt></ruby>は　ゆうめい<span class=\"blank\">____</span>。","ro":"ano人ha yuumei ... 。","speak":"あの人は ゆうめい えす 。","opts":["なです","くないです","くなかった","ではありません"],"ans":3,"k":"dewa","why":"setelah い di Bentuk ではありません berarti \"bukan / tidak\". Menyatakan negasi untuk kata benda.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":6,"q":"　　　　　　で　ばんごはんを　食べますか。","html":"<span class=\"blank\">____</span>で　ばんごはんを　<ruby>食<rt>shoku</rt></ruby>べますか。","ro":"... de bangohano 食bemasuka。","speak":"えす で ばんごはんを 食べますか。","opts":["どこ","どんな","どう","どの"],"ans":0,"k":"kihon","why":"Bentuk kamus (asli). Setelah を, kata kerja tidak boleh diubah ke te-form maupun lampau.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":7,"q":"　　　　　　かばんが　なかむらさんのですか。","html":"<span class=\"blank\">____</span>かばんが　なかむらさんのですか。","ro":"... kabanga nakamurasannodesuka。","speak":"えす かばんが なかむらさんのですか。","opts":["どの","どう","どれ","どちら"],"ans":0,"k":"qword","why":"Kata tanya interogatif. Pilih yang paling sesuai dengan hal yang ditanyakan di kalimat.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":8,"q":"　　　　　　スポーツが　すきですか。","html":"<span class=\"blank\">____</span>スポーツが　すきですか。","ro":"... supotuga sukidesuka。","speak":"えす スポーツが すきですか。","opts":["どこ","どれ","どちら","どんな"],"ans":3,"k":"kihon","why":"Bentuk kamus (asli). Setelah を, kata kerja tidak boleh diubah ke te-form maupun lampau.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":9,"q":"みかんは　　　　　　　ありますか。","html":"みかんは<span class=\"blank\">____</span>ありますか。","ro":"mikanha ... arimasuka。","speak":"みかんは えす ありますか。","opts":["なに","いくつ","どれ","どの"],"ans":1,"k":"kihon","why":"setelah は di Bentuk kamus (asli). Setelah を, kata kerja tidak boleh diubah ke te-form maupun lampau.","note":""},{"part":"PART 1","title":"JLPT N5 Grammar Quiz 01","url":"https://forms.gle/v6p1ERrmEHgmu8KZ8","no":10,"q":"すみません。トイレは　　　　　　　ですか。","html":"すみません。トイレは<span class=\"blank\">____</span>ですか。","ro":"sumimasen。toireha ... desuka。","speak":"すみません。トイレは えす ですか。","opts":["どこか","どちら","どの","どなた"],"ans":1,"k":"kihon","why":"setelah は di Bentuk kamus (asli). Setelah を, kata kerja tidak boleh diubah ke te-form maupun lampau.","note":""},{"part":"PART 2","title":"JLPT N5 Grammar Quiz 02","url":"https://forms.gle/ti8CFTdszDYoSrHn8","no":1,"q":"みかん　　　　　　　３つ　買いました。","html":"みかん<span class=\"blank\">____</span>３つ　<ruby>買<rt>bai</rt></ruby>いました。","ro":"mikan ... ３tu 買imasita。","speak":"みかん えす ３つ 買いました。","opts":["が","に","を","の"],"ans":2,"k":"wo","why":"setelah ん di Kasus を menandai objek langsung, arah, atau \"melewati\".","note":""},{"part":"PART 2","title":"JLPT N5 Grammar Quiz 02","url":"https://forms.gle/ti8CFTdszDYoSrHn8","no":2,"q":"きのう　だれ　　　　　　　いっしょに　えいがを　見ましたか。","html":"きのう　だれ<span class=\"blank\">____</span>いっしょに　えいがを　<ruby>見<rt>ken</rt></ruby>ましたか。","ro":"kinou dare ... i'tusi'yoni eigao 見masitaka。","speak":"きのう だれ えす いっしょに えいがを 見ましたか。","opts":["を","に","で","と"],"ans":3,"k":"to","why":"setelah れ di Kasus と berarti \"bersama\" atau \"dan\", menyamakan dua hal.","note":""},{"part":"PART 2","title":"JLPT N5 Grammar Quiz 02","url":"https://forms.gle/ti8CFTdszDYoSrHn8","no":3,"q":"すみません、コーヒー　　　　　　　ください。","html":"すみません、コーヒー<span class=\"blank\">____</span>ください。","ro":"sumimasen、kohi ... kudasai。","speak":"すみません、コーヒー えす ください。","opts":["が","に","を","や"],"ans":2,"k":"wo","why":"Kasus を menandai objek langsung, arah, atau \"melewati\".","note":""},{"part":"PART 2","title":"JLPT N5 Grammar Quiz 02","url":"https://forms.gle/ti8CFTdszDYoSrHn8","no":4,"q":"ペンは　５本　　　　　　　３００円です。","html":"ペンは　５<ruby>本<rt>hon</rt></ruby><span class=\"blank\">____</span>３００<ruby>円<rt>en</rt></ruby>です。","ro":"penha ５本 ... ３００円desu。","speak":"ペンは ５本 えす ３００円です。","opts":["を","に","で","と"],"ans":2,"k":"de","why":"Kasus で berarti alat yang dipakai, atau tempat kejadian.","note":""},{"part":"PART 2","title":"JLPT N5 Grammar Quiz 02","url":"https://forms.gle/ti8CFTdszDYoSrHn8","no":5,"q":"テーブルの　上に　ナイフ　　　　　　　フォークなどが　あります。","h an class=\"blank\">____</span>ゆきが　あります。","ro":"ano 山no 上niha 一年 ... yukiga arimasu。","speak":"あの 山の 上には 一年 えす ゆきが あります。","opts":["など","から","じゅう","ごろ"],"ans":2,"k":"juu","why":"Juu じゅう berarti \"tepat / sepanjang\". Untuk jam biasanya digabung dengan が.","note":""},{"part":"PART 11","title":"JLPT N5 Grammar Quiz 11","url":"https://forms.gle/Dk3uEr469tChAmG99","no":10,"q":"20分　　　　　　　まちましたが、バスは　来ませんでした。","html":"20<ruby>分<rt>pun/bun</rt></ruby><span class=\"blank\">____</span>まちましたが、バスは　<ruby>来<rt>rai</rt></ruby>ませんでした。","ro":"20分 ... matimasitaga、basuha 来masendesita。","speak":"20分 えす まちましたが、バスは 来ませんでした。","opts":["ごろ","じゅう","しか","ぐらい"],"ans":3,"k":"gurai","why":"Gurai ぐらい berarti \"sekitar / tidak lebih dari\". Untuk waktu maupun besaran, boleh diikuti を.","note":""}];
const LETTER = ['a','b','c','d'];
let state = {};          // idx -> 1
let cur = 'ALL';
let onlyBad = false;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const main = $('#main'), tabs = $('#tabs');
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function parts(){ return [...new Set(Q.map(x => x.part))]; }
function blank(s){
  return esc(s)
    .replace(/_{2,}/g, '<span class="blank">____</span>')
    .replace(/ {3,}/g, '<span class="blank">____</span>');
}

/* ---------- TTS ---------- */
let jpVoices = [];
function loadVoices(){
  jpVoices = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function say(text){
  if(!('speechSynthesis' in window)){ toast('Browser tidak punya text-to-speech'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.82; u.pitch = 1;
  if(jpVoices.length) u.voice = jpVoices[0];
  speechSynthesis.speak(u);
}

/* ---------- stats (CountUp) ---------- */
let shown = {right:0, done:0, wrong:0};
function countTo(el, from, to){
  if(from === to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 420;
  (function step(t){
    const k = Math.min(1, (t - t0)/dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}
function stats(){
  const keys = Object.keys(state);
  let right = 0;
  keys.forEach(i => { if(state[i] === Q[i].ans) right++; });
  const done = keys.length, wrong = done - right;

  countTo($('#sRight'), shown.right, right);
  countTo($('#sDone'),  shown.done,  done);
  countTo($('#sWrong'), shown.wrong, wrong);
  shown = {right, done, wrong};

  const p = $('#sPct'), ring = $('#ringFg'), lbl = $('#ringLbl');
  const C = 119.4;
  if(!done){
    p.className = 'pct';
    lbl.textContent = '0%';
    ring.style.strokeDashoffset = C;
    ring.style.stroke = '';
  } else {
    const a = Math.round(right/done*100);
    p.className = 'pct ' + (a>=80?'good':a>=50?'mid':'low');
    lbl.textContent = a + '%';
    ring.style.strokeDashoffset = C - C*(a/100);
    ring.style.stroke = a>=80 ? 'var(--ok)' : a>=50 ? 'var(--warn)' : 'var(--bad)';
  }

  const bar = $('#pbar');
  bar.firstElementChild.style.width = (Q.length ? done/Q.length*100 : 0) + '%';
  bar.className = 'pbar' + (done && right===done ? ' ok' : '');
}

/* ---------- toast ---------- */
let toastT = null;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast up ' + (kind || '');
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.className = 'toast ' + (kind || ''); }, 1900);
}

/* ---------- confetti ---------- */
function confetti(x, y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['var(--ok)','var(--accent)','var(--warn)','var(--accent2)'];
  for(let n=0;n<16;n++){
    const s = document.createElement('b');
    s.className = 'spark';
    const ang = (Math.PI*2*n)/16 + Math.random()*0.5;
    const dist = 40 + Math.random()*70;
    s.style.cssText = 'left:'+x+'px;top:'+y+'px;background:'+colors[n%4]+
      ';--dx:'+Math.cos(ang)*dist+'px;--dy:'+(Math.sin(ang)*dist + 40)+'px;'+
      '--rot:'+(Math.random()*720-360)+'deg;width:'+(4+Math.random()*4)+'px;height:'+(4+Math.random()*4)+'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

/* ---------- render ---------- */
function visible(){
  let idx = [];
  for(let i=0;i<Q.length;i++){
    if(cur !== 'ALL' && Q[i].part !== cur) continue;
    if(onlyBad && !(i in state && state[i] !== Q[i].ans)) continue;
    idx.push(i);
  }
  return idx;
}

function render(){
  main.innerHTML = '';
  const idx = visible();
  let last = null, n = 0;
  idx.forEach(i => {
    const it = Q[i];
    if(it.part !== last){
      last = it.part;
      const h = document.createElement('h2');
      h.className = 'ph';
      h.style.animationDelay = (n*22) + 'ms';
      const label = it.part === cur ? it.title : it.part + ' — ' + it.title;
      h.innerHTML = '<span class="n">'+esc(it.part)+'</span>'+esc(label)+
                    '<span class="meta">'+it.opts.length+' pilihan</span>';
      main.appendChild(h);
    }
    const c = card(i, it);
    c.style.animationDelay = Math.min(n*26, 420) + 'ms';
    main.appendChild(c);
    n++;
  });
  if(!idx.length){
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = onlyBad ? 'Tidak ada jawaban salah. Semua beres.' : 'Tidak ada soal untuk filter ini.';
    main.appendChild(p);
  }
  renderTabs();
}

function whyNode(it){
  const w = document.createElement('div'); w.className = 'why';
  let h = '<b>Kenapa?</b> ' + esc(it.why);
  h += '<b>Kunci &mdash; ' + LETTER[it.ans] + '. ' + esc(it.opts[it.ans]) + '</b>';
  if(it.note) h += '<i>' + esc(it.note) + '</i>';
  w.innerHTML = h;
  return w;
}

function card(i, it){
  const c = document.createElement('div'); c.className = 'card'; c.dataset.i = i;
  if(i in state){
    c.classList.add(state[i]===it.ans ? 'ok' : 'no');
    c.classList.add('ans');
  }

  const n = document.createElement('div'); n.className='qn';
  n.innerHTML = esc(it.part)+' · soal '+it.no+'<span class="src">'+esc(it.title)+'</span>' +
    (it.url ? '<a class="srcf" href="'+esc(it.url)+'" target="_blank" rel="noopener">form &rarr;</a>' : '');
  const q = document.createElement('div'); q.className='q'; q.innerHTML = it.html || blank(it.q);
  c.appendChild(n); c.appendChild(q);
  const ex = document.createElement('div'); ex.className = 'extras';
  if(it.ro){ const r = document.createElement('span'); r.className = 'ro';
    r.textContent = it.ro; ex.appendChild(r); }
  if(it.speak){
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'tts'; b.title = 'Dengarkan soal';
    b.textContent = '\u{1F50A} dengar';
    b.onclick = e => { e.stopPropagation(); say(it.speak); };
    ex.appendChild(b);
  }
  if(ex.childNodes.length) c.appendChild(ex);

  it.opts.forEach((o,oi) => {
    const b = document.createElement('button'); b.className='opt'; b.type='button';
    b.innerHTML = '<span class="k">'+LETTER[oi]+'</span><span>'+esc(o)+'</span><span class="mk"></span>';
    if(i in state){
      b.disabled = true;
      if(oi === it.ans){ b.classList.add('ok'); b.querySelector('.mk').textContent = '✓'; }
      if(oi === state[i] && oi !== it.ans){ b.classList.add('no'); b.querySelector('.mk').textContent = '✗'; }
    } else {
      b.onclick = () => pick(i, oi);
    }
    c.appendChild(b);
  });

  const fx = document.createElement('div'); fx.className='fx';
  if(i in state){
    fx.textContent = state[i]===it.ans
      ? '✓ Benar — ' + LETTER[it.ans] + '. ' + it.opts[it.ans]
      : '✗ Jawabanmu ' + LETTER[state[i]] + ' — yang benar ' + LETTER[it.ans] + '. ' + it.opts[it.ans];
  }
  c.appendChild(fx);
  if(i in state) c.appendChild(whyNode(it));
  return c;
}

function pick(i, oi){
  if(i in state) return;
  state[i] = oi;
  const right = oi === Q[i].ans;
  const c = main.querySelector('.card[data-i="'+i+'"]');
  c.classList.add(right ? 'ok' : 'no');
  c.classList.add('ans');
  c.querySelectorAll('.opt').forEach((b,bi) => {
    b.disabled = true; b.onclick = null;
    if(bi === Q[i].ans){ b.classList.add('ok'); b.querySelector('.mk').textContent='✓'; }
    if(bi === oi && !right){ b.classList.add('no'); b.querySelector('.mk').textContent='✗'; }
  });
  const fx = document.createElement('div'); fx.className='fx';
  c.appendChild(whyNode(Q[i]));
  fx.textContent = right
    ? '✓ Benar — ' + LETTER[Q[i].ans] + '. ' + Q[i].opts[Q[i].ans]
    : '✗ Jawabanmu ' + LETTER[oi] + ' — yang benar ' + LETTER[Q[i].ans] + '. ' + Q[i].opts[Q[i].ans];
  c.appendChild(fx);
  stats();

  if(right){
    const k = c.querySelector('.opt.ok .k');
    const r = k.getBoundingClientRect();
    confetti(r.left + r.width/2, r.top + r.height/2);
    c.classList.add('flash');
    setTimeout(() => c.classList.remove('flash'), 620);
  }
  renderTabs();
  if(onlyBad) setTimeout(render, 340);
}

/* ---------- tabs ---------- */
function renderTabs(){
  tabs.innerHTML = '';
  const all = document.createElement('button');
  all.className='tab'+(cur==='ALL'?' on':'');
  all.textContent = 'Semua';
  let a=0,r=0;
  for(let i=0;i<Q.length;i++) if(i in state){ a++; if(state[i]===Q[i].ans) r++; }
  if(a) all.appendChild(badge(r, a));
  all.onclick = () => { onlyBad=false; switchTo('ALL', () => { cur='ALL'; render(); }); };
  tabs.appendChild(all);

  parts().forEach(p => {
    const t = document.createElement('button');
    let ansd = 0, right = 0;
    for(let i=0;i<Q.length;i++){
      if(Q[i].part !== p) continue;
      if(i in state){ ansd++; if(state[i] === Q[i].ans) right++; }
    }
    t.className = 'tab' + (cur===p?' on':'');
    t.appendChild(document.createTextNode(p));
    if(ansd) t.appendChild(badge(right, ansd));
    t.onclick = () => { onlyBad=false; switchTo(p, () => { cur = p; render(); }); };
    tabs.appendChild(t);
  });
}
function badge(right, total){
  const s = document.createElement('span');
  const rate = right/total;
  s.className = 'mini' + (rate===1 ? ' full' : rate>=0.5 ? ' half' : ' empty');
  s.textContent = right + '/' + total;
  return s;
}

/* ---------- theme ---------- */
function applyTheme(){
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeIco').innerHTML = dark ? '&#9789;' : '&#9788;';
  $('#themeTxt').textContent = dark ? 'Terang' : 'Gelap';
  $('#themeBtn').setAttribute('aria-pressed', String(dark));
}
function toggleTheme(){
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('bunpou-theme', next);
  applyTheme();
}

/* ---------- toolbar ---------- */
function resetAll(){
  state = {}; onlyBad = false; render(); stats();
  toast('Progress direset');
}
function revealPart(){
  const list = visible();
  if(!list.length) return;
  const fresh = list.filter(i => !(i in state));
  if(!fresh.length){ toast('Part ini sudah lengkap'); return; }
  fresh.forEach(i => { state[i] = Q[i].ans; });
  render(); stats();
  toast(fresh.length + ' soal dibuka kuncinya', 'ok');
}
function onlyWrong(){
  onlyBad = !onlyBad;
  render();
  toast(onlyBad ? 'Menampilkan soal salah saja' : 'Tampilkan semua soal');
}
function jumpWrong(){
  const bad = Q.findIndex((x,i) => i in state && state[i] !== x.ans);
  if(bad < 0){ toast('Belum ada jawaban salah', 'ok'); return; }
  cur = 'ALL'; onlyBad = false; render();
  const el = main.querySelector('.card[data-i="'+bad+'"]');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- boot ---------- */
(function boot(){
  const el = $('#boot'), msg = $('#bootMsg');
  const steps = ['Menyiapkan 110 soal','Memuat kunci jawaban','Menyusun kartu'];
  let i = 0;
  const tick = setInterval(() => {
    i++;
    if(i < steps.length) msg.textContent = steps[i];
  }, 210);
  function ready(){
    clearInterval(tick);
    el.classList.add('gone');
    setTimeout(() => el.remove(), 560);
  }
  if(document.readyState === 'complete') setTimeout(ready, 620);
  else addEventListener('load', () => setTimeout(ready, 620));
})();

/* ---------- per-part loading ---------- */
let loadT = null;
function switchTo(part, done){
  const pl = $('#partload');
  pl.classList.add('on');
  clearTimeout(loadT);
  loadT = setTimeout(() => {
    done();
    setTimeout(() => pl.classList.remove('on'), 120);
  }, 300);
}

applyTheme();
render(); stats();

/* ---------- spotlight (React Bits) ---------- */
main.addEventListener('pointermove', e => {
  const c = e.target.closest('.card');
  if(!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', ((e.clientX - r.left)/r.width*100).toFixed(1) + '%');
  c.style.setProperty('--my', ((e.clientY - r.top)/r.height*100).toFixed(1) + '%');
});

/* ---------- sticky header shrink ---------- */
let ticking = false;
addEventListener('scroll', () => {
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    $('#hd').classList.toggle('shrink', scrollY > 12);
    ticking = false;
  });
}, {passive:true});

/* ---------- keyboard ---------- */
const KEYMAP = {a:0,b:1,c:2,d:3,1:0,2:1,3:2,4:3};
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(/^(input|textarea|select)$/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if(k === 'r'){ resetAll(); return; }
  if(k === 's'){ revealPart(); return; }
  if(k === 'w'){ onlyWrong(); return; }
  if(k === 't'){ toggleTheme(); return; }
  if(!(k in KEYMAP)) return;
  const pending = visible().find(i => !(i in state));
  if(pending === undefined) return;
  const card = main.querySelector('.card[data-i="'+pending+'"]');
  if(!card) return;
  const opt = card.querySelectorAll('.opt')[KEYMAP[k]];
  if(opt && !opt.disabled){
    opt.click();
    setTimeout(() => {
      const next = main.querySelector('.card[data-i="'+pending+'"] + .card');
      if(next) next.scrollIntoView({behavior:'smooth', block:'center'});
    }, 300);
  }
});
</script>
</body>
</html>
